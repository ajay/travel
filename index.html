<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000" />
    <meta name="description" content="A static, read-only world travel map." />
    <title>ajay.engineer/travel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="./site-common/theme.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./js/favicon.js"></script>
  </head>
  <body>
    <header>
      <div class="header-left">
        <div class="logo">
          <span class="logo-host"
            ><a href="https://ajay.engineer/">ajay.engineer</a>/</span
          >travel
        </div>
        <div class="stats-bar">
          <div class="stat">
            <div class="stat-num visited" id="count-visited">0</div>
            <div class="stat-label">visited</div>
          </div>
          <div class="stat">
            <div class="stat-num planned" id="count-planned">0</div>
            <div class="stat-label">planned</div>
          </div>
          <div class="stat">
            <div class="stat-num wishlist" id="count-wishlist">0</div>
            <div class="stat-label">wishlist</div>
          </div>
        </div>
      </div>
      <div
        class="travellers"
        id="travellers"
        role="group"
        aria-label="travellers"
      ></div>
      <div class="header-right">
        <button id="stats-toggle-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          stats
        </button>
        <button id="list-toggle-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <circle cx="3" cy="6" r="1" fill="currentColor" />
            <circle cx="3" cy="12" r="1" fill="currentColor" />
            <circle cx="3" cy="18" r="1" fill="currentColor" />
          </svg>
          list
        </button>
        <button id="export-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span>png</span>
        </button>
      </div>
    </header>

    <div class="map-container">
      <svg id="map-svg">
        <defs>
          <pattern
            id="wishlist-hatch"
            class="wishlist"
            width="3"
            height="3"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
          >
            <rect width="3" height="3" />
            <line x1="0.75" y1="0" x2="0.75" y2="3" stroke-width="1.25" />
          </pattern>
          <pattern
            id="wishlist-hatch-sm"
            class="wishlist"
            width="2"
            height="2"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
          >
            <rect width="2" height="2" />
            <line x1="0.5" y1="0" x2="0.5" y2="2" stroke-width="0.85" />
          </pattern>
          <pattern
            id="wishlist-hatch-s0"
            class="wishlist s0"
            data-rot="45"
            width="3"
            height="3"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
          >
            <rect width="3" height="3" />
            <line x1="0.425" y1="0" x2="0.425" y2="3" stroke-width="0.85" />
            <line x1="0" y1="0.425" x2="3" y2="0.425" stroke-width="0.85" />
          </pattern>
          <pattern
            id="wishlist-hatch-s1"
            class="wishlist s1"
            data-rot="45"
            width="3"
            height="3"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
          >
            <rect width="3" height="3" />
            <line x1="0.75" y1="0" x2="0.75" y2="3" stroke-width="1.25" />
          </pattern>
          <pattern
            id="wishlist-hatch-s2"
            class="wishlist s2"
            data-rot="-45"
            width="3"
            height="3"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(-45)"
          >
            <rect width="3" height="3" />
            <line x1="0.75" y1="0" x2="0.75" y2="3" stroke-width="1.25" />
          </pattern>
          <pattern
            id="wishlist-hatch-s0-sm"
            class="wishlist s0"
            data-rot="45"
            width="2"
            height="2"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
          >
            <rect width="2" height="2" />
            <line x1="0.3" y1="0" x2="0.3" y2="2" stroke-width="0.6" />
            <line x1="0" y1="0.3" x2="2" y2="0.3" stroke-width="0.6" />
          </pattern>
          <pattern
            id="wishlist-hatch-s1-sm"
            class="wishlist s1"
            data-rot="45"
            width="2"
            height="2"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
          >
            <rect width="2" height="2" />
            <line x1="0.5" y1="0" x2="0.5" y2="2" stroke-width="0.85" />
          </pattern>
          <pattern
            id="wishlist-hatch-s2-sm"
            class="wishlist s2"
            data-rot="-45"
            width="2"
            height="2"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(-45)"
          >
            <rect width="2" height="2" />
            <line x1="0.5" y1="0" x2="0.5" y2="2" stroke-width="0.85" />
          </pattern>
        </defs>
      </svg>

      <!-- Stats: left panel on desktop, bottom sheet on mobile -->
      <aside class="panel stats" id="stats">
        <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
        <div class="panel-body">
          <div class="sp-title">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
            travel stats
          </div>

          <div class="world-ring-wrap">
            <svg class="ring-svg" width="72" height="72" viewBox="0 0 72 72">
              <circle class="ring-bg" cx="36" cy="36" r="28" />
              <circle
                class="ring-fill"
                id="ring-fill"
                cx="36"
                cy="36"
                r="28"
                stroke-dasharray="0 176"
              />
              <circle
                class="ring-fill"
                id="ring-fill-1"
                cx="36"
                cy="36"
                r="28"
                stroke-dasharray="0 176"
              />
              <circle
                class="ring-fill"
                id="ring-fill-2"
                cx="36"
                cy="36"
                r="28"
                stroke-dasharray="0 176"
              />
            </svg>
            <div class="ring-text-wrap">
              <div class="ring-pct" id="ring-pct">0<span>%</span></div>
              <div class="ring-label">of the world visited</div>
              <div class="ring-sub" id="ring-sub">0 of 196 countries</div>
            </div>
          </div>

          <div class="who-stats" id="who-stats"></div>

          <div class="continent-section">
            <div class="section-label">by continent</div>
            <div id="continent-bars"></div>
          </div>
        </div>
      </aside>

      <!-- Country detail: right panel on desktop, bottom sheet on mobile -->
      <aside class="panel detail" id="detail">
        <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
        <div class="panel-body">
          <button class="panel-close" id="detail-close">✕</button>
          <div class="country-flag" id="detail-flag"></div>
          <div class="country-name" id="detail-name"></div>
          <div class="country-region" id="detail-region"></div>
          <div class="data-grid" id="detail-data"></div>
          <div id="detail-mydata"></div>
          <div class="wiki-content" id="wiki-content"></div>
        </div>
      </aside>

      <div id="tooltip"></div>
      <div class="search-wrap">
        <input
          type="text"
          class="search-input"
          id="search"
          placeholder="🔍  search country…"
          autocomplete="off"
        />
        <div class="search-results" id="search-results"></div>
      </div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">−</button>
        <button class="zoom-btn" id="zoom-reset">⌂</button>
      </div>

      <!-- Backdrop behind the detail sheet (mobile only) -->
      <div class="sheet-overlay" id="sheet-overlay"></div>

      <!-- List overlay + panel -->
      <div class="list-overlay" id="list-overlay"></div>
      <div class="list-panel" id="list-panel">
        <div class="list-header">
          <div class="list-header-top">
            <div class="list-title">
              <span class="emoji">🗺️</span> countries
            </div>
            <button class="list-close-btn" id="list-close-btn">✕</button>
          </div>
          <div class="list-tabs">
            <button class="list-tab active" data-filter="visited">
              <span class="emoji">✅</span> visited
            </button>
            <button class="list-tab" data-filter="planned">
              <span class="emoji">📅</span> planned
            </button>
            <button class="list-tab" data-filter="wishlist">
              <span class="emoji">💛</span> wishlist
            </button>
          </div>
          <input
            class="list-search"
            id="list-search"
            placeholder="filter countries…"
            autocomplete="off"
          />
        </div>
        <div class="list-body" id="list-body"></div>
      </div>

      <!-- Mobile Nav Bar -->
      <nav class="mobile-nav" id="mobile-nav">
        <button class="mobile-nav-btn" id="mob-search-btn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.35-4.35" />
          </svg>
          search
        </button>
        <button class="mobile-nav-btn" id="mob-stats-btn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          stats
        </button>
        <button class="mobile-nav-btn" id="mob-list-btn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <circle cx="3" cy="6" r="1" fill="currentColor" />
            <circle cx="3" cy="12" r="1" fill="currentColor" />
            <circle cx="3" cy="18" r="1" fill="currentColor" />
          </svg>
          list
        </button>
      </nav>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
