<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="description" content="A static, read-only world travel map." />
    <title>Atlas — My World Travel Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./js/favicon.js"></script>
  </head>
  <body>
    <div class="loading-overlay" id="loading">
      <div class="loading-logo">Atlas</div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>

    <header>
      <div style="display: flex; align-items: center; gap: 20px">
        <div class="logo">Atlas <span>World Travel Tracker</span></div>
        <div class="stats-bar">
          <div class="stat">
            <div class="stat-num v" id="count-visited">0</div>
            <div class="stat-label">Visited</div>
          </div>
          <div class="stat">
            <div class="stat-num p" id="count-planned">0</div>
            <div class="stat-label">Planned</div>
          </div>
          <div class="stat">
            <div class="stat-num w" id="count-wishlist">0</div>
            <div class="stat-label">Wishlist</div>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--visited)"></div>
            Visited
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--planned)"></div>
            Planned
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--wishlist)"></div>
            Wishlist
          </div>
        </div>
        <button class="stats-toggle-btn" id="stats-toggle-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          My Stats
        </button>
        <button class="list-toggle-btn" id="list-toggle-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <circle cx="3" cy="6" r="1" fill="currentColor" />
            <circle cx="3" cy="12" r="1" fill="currentColor" />
            <circle cx="3" cy="18" r="1" fill="currentColor" />
          </svg>
          My List
        </button>
        <button class="export-btn" id="export-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Export PNG
        </button>
      </div>
    </header>

    <div class="map-container">
      <svg id="map-svg"></svg>

      <!-- Stats: left panel on desktop, bottom sheet on mobile -->
      <aside class="panel stats" id="stats">
        <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
        <div class="panel-body">
          <div class="sp-title">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
            My Travel Stats
          </div>

          <div class="world-ring-wrap">
            <svg class="ring-svg" width="72" height="72" viewBox="0 0 72 72">
              <circle class="ring-bg" cx="36" cy="36" r="28" />
              <circle
                class="ring-fill"
                id="ring-fill"
                cx="36"
                cy="36"
                r="28"
                stroke-dasharray="0 176"
              />
            </svg>
            <div class="ring-text-wrap">
              <div class="ring-pct" id="ring-pct">0<span>%</span></div>
              <div class="ring-label">of the world visited</div>
              <div class="ring-sub" id="ring-sub">0 of 195 countries</div>
            </div>
          </div>

          <div class="continent-section">
            <div class="section-label">By Continent</div>
            <div id="continent-bars"></div>
          </div>

          <div class="badges-section">
            <div class="section-label">Achievements</div>
            <div class="badges-grid" id="badges-grid"></div>
          </div>
        </div>
      </aside>

      <!-- Country detail: right panel on desktop, bottom sheet on mobile -->
      <aside class="panel detail" id="detail">
        <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
        <div class="panel-body">
          <button class="panel-close" id="detail-close">✕</button>
          <div class="country-flag" id="detail-flag"></div>
          <div class="country-name" id="detail-name"></div>
          <div class="country-region" id="detail-region"></div>
          <div class="data-grid" id="detail-data"></div>
          <div id="detail-mydata"></div>
          <div class="panel-divider"></div>
          <div class="wiki-section">
            <button class="wiki-toggle" id="wiki-toggle">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              Learn more about this country
            </button>
            <div class="wiki-content" id="wiki-content"></div>
          </div>
        </div>
      </aside>

      <div id="tooltip"></div>
      <div class="search-wrap">
        <input
          type="text"
          class="search-input"
          id="search"
          placeholder="🔍  Search country..."
          autocomplete="off"
        />
        <div class="search-results" id="search-results"></div>
      </div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">−</button>
        <button class="zoom-btn" id="zoom-reset" style="font-size: 0.68rem">
          ⌂
        </button>
      </div>

      <!-- Backdrop behind the detail sheet (mobile only) -->
      <div class="sheet-overlay" id="sheet-overlay"></div>

      <!-- List overlay + panel -->
      <div class="list-overlay" id="list-overlay"></div>
      <div class="list-panel" id="list-panel">
        <div class="list-header">
          <div class="list-header-top">
            <div class="list-title">🗺️ My Countries</div>
            <button class="list-close-btn" id="list-close-btn">✕</button>
          </div>
          <div class="list-tabs">
            <button class="list-tab active" data-filter="visited">
              ✅ Visited
            </button>
            <button class="list-tab" data-filter="planned">📅 Planned</button>
            <button class="list-tab" data-filter="wishlist">💛 Wishlist</button>
          </div>
          <input
            class="list-search"
            id="list-search"
            placeholder="Filter countries…"
            autocomplete="off"
            style="font-size: 16px"
          />
        </div>
        <div class="list-body" id="list-body"></div>
      </div>

      <!-- Mobile Nav Bar -->
      <nav class="mobile-nav" id="mobile-nav">
        <button class="mobile-nav-btn" id="mob-search-btn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.35-4.35" />
          </svg>
          Search
        </button>
        <button class="mobile-nav-btn" id="mob-stats-btn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          Stats
        </button>
        <button class="mobile-nav-btn" id="mob-list-btn">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <circle cx="3" cy="6" r="1" fill="currentColor" />
            <circle cx="3" cy="12" r="1" fill="currentColor" />
            <circle cx="3" cy="18" r="1" fill="currentColor" />
          </svg>
          List
        </button>
      </nav>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
